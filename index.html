type StageId = 'all' | 'stage-1' | 'stage-2' | 'stage-3';

type LessonType = 'theory' | 'flashcard' | 'exercise' | 'answer_key';

type LessonStatus = 'not_started' | 'in_progress' | 'completed';

type SyncState = 'synced' | 'syncing' | 'offline' | 'guest';

// 1. Bảng public.users
interface UserProfile {
  id: string;
  email: string;
  full_name: string;
  avatar_url: string;
  target_school: string;
  target_score: number;
  streak_days: number;
  last_active_device: string;
  last_synced_at: string;
  created_at?: string;
  updated_at?: string;
}

// 2. Bảng public.user_progress
interface UserProgressRecord {
  id: string;
  user_id: string;
  course_id: string;
  lesson_id: string;
  stage_id: Exclude<StageId, 'all'>;
  status: LessonStatus;
  completion_percent: number;
  quiz_score: number | null;
  correct_answers: number;
  total_questions: number;
  time_spent_seconds: number;
  bookmarked: boolean;
  user_notes: string;
  device_updated: string;
  last_accessed_at: string;
  updated_at: string;
}

// 3. Bảng public.flashcard_stats
interface FlashcardStatRecord {
  id: string;
  user_id: string;
  card_id: string;
  course_id: string;
  stage_id: Exclude<StageId, 'all'>;
  mastery_level: 'new' | 'learning' | 'reviewing' | 'mastered';
  box_number: 1 | 2 | 3 | 4 | 5;
  review_count: number;
  correct_streak: number;
  typing_accuracy: number;
  last_reviewed_at: string;
  next_review_at: string;
  updated_at: string;
}

// ============================================================================

interface TheoryTableData {
  headers: string[];
  rows: string[][];
}

interface TheorySection {
  id: string;
  title: string;
  description?: string;
  bullets?: string[];
  table?: TheoryTableData;
  examTraps?: {
    title: string;
    items: string[];
  };
}

interface FlashcardItem {
  id: string;
  course_id: string;
  stage_id: Exclude<StageId, 'all'>;
  category: string;
  front: string;
  pronunciation?: string;
  back: string;
  example: string;
  examTip?: string;
}

interface ExerciseQuestion {
  id: string;
  number: number;
  type: 'multiple_choice' | 'verb_form' | 'word_form' | 'sentence_transformation' | 'reading';
  sectionTitle: string;
  passage?: string;
  prompt: string;
  options?: string[];          // Cho trắc nghiệm (A, B, C, D)
  rewritePrefix?: string;      // Cho viết lại câu (VD: "-> My sister has ")
  keywordHint?: string;        // Từ gợi ý trong ngoặc (VD: "(SPENT)", "(TRADITION)")
  correctAnswer: string;       // Đáp án chính xác từ tài liệu Word
  acceptedAnswers?: string[];  // Các phương án đúng tương đương được ghi trong Word
  explanation: string;         // Giải thích chi tiết nguyên văn từ tài liệu Word
}

interface LessonItem {
  id: string;
  course_id: string;
  stage_id: Exclude<StageId, 'all'>;
  title: string;
  type: LessonType;
  typeLabel: string;
  durationMinutes: number;
  summary: string;
  orderIndex: number;
}

interface CourseTopic {
  id: string;
  code: string;                // VD: 'CHUYÊN ĐỀ 1', 'CHUYÊN ĐỀ 1 (GĐ 2)'

  badgeColor: string;
  orderIndex: number;
  lessons: LessonItem[];

  flashcards: FlashcardItem[];

interface ExamTipItem {
  id: string;
  category: string;
  title: string;
  badge: string;
  content: string;
  highlightRule: string;
  examples: string[];

const STORAGE_KEYS = {
  SESSION_USER: 'em9_session_user_v1',
  USER_PROGRESS: 'em9_user_progress_v1',
  FLASHCARD_STATS: 'em9_flashcard_stats_v1',
};

const LearningStoreContext = createContext<LearningStoreContextValue | undefined>(undefined);

function arrayToProgressMap(arr: UserProgressRecord[]): Record<string, UserProgressRecord> {
  const map: Record<string, UserProgressRecord> = {};
  arr.forEach((item) => {
    map[item.lesson_id] = item;
  });
  return map;
}

function arrayToFlashcardMap(arr: FlashcardStatRecord[]): Record<string, FlashcardStatRecord> {
  const map: Record<string, FlashcardStatRecord> = {};
  arr.forEach((item) => {
    map[item.card_id] = item;
  });
  return map;
}

const LearningStoreProvider: React.FC<{ children: React.ReactNode }> = ({ children }) => {
  // 1. Khởi tạo Session User từ localStorage (Giữ phiên đăng nhập)
  const [user, setUser] = useState<UserProfile | null>(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEYS.SESSION_USER);
      if (saved) return JSON.parse(saved);
      // Mặc định đăng nhập sẵn tài khoản mẫu để người dùng trải nghiệm ngay tính năng Cloud Sync
      localStorage.setItem(STORAGE_KEYS.SESSION_USER, JSON.stringify(DEFAULT_DEMO_USER));
      return DEFAULT_DEMO_USER;
    } catch {
      return DEFAULT_DEMO_USER;
    }
  });

  // 2. Khởi tạo UserProgress từ localStorage / Mock DB
  const [progressRecords, setProgressRecords] = useState<Record<string, UserProgressRecord>>(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEYS.USER_PROGRESS);
      if (saved) return JSON.parse(saved);
      const initialMap = arrayToProgressMap(INITIAL_USER_PROGRESS);
      localStorage.setItem(STORAGE_KEYS.USER_PROGRESS, JSON.stringify(initialMap));
      return initialMap;
    } catch {
      return arrayToProgressMap(INITIAL_USER_PROGRESS);
    }
  });

  // 3. Khởi tạo FlashcardStats từ localStorage / Mock DB
  const [flashcardStats, setFlashcardStats] = useState<Record<string, FlashcardStatRecord>>(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEYS.FLASHCARD_STATS);
      if (saved) return JSON.parse(saved);
      const initialMap = arrayToFlashcardMap(INITIAL_FLASHCARD_STATS);
      localStorage.setItem(STORAGE_KEYS.FLASHCARD_STATS, JSON.stringify(initialMap));
      return initialMap;
    } catch {
      return arrayToFlashcardMap(INITIAL_FLASHCARD_STATS);
    }
  });

  const [syncState, setSyncState] = useState<SyncState>(user ? 'synced' : 'guest');
  const [lastSyncedAt, setLastSyncedAt] = useState<string>(new Date().toISOString());
  const [activeDeviceName, setActiveDeviceName] = useState<string>('Máy tính (Desktop Web)');

  // Navigation & UI state
  const [activeNav, setActiveNav] = useState<NavSectionId>('dashboard');
  const [selectedStage, setSelectedStage] = useState<StageId>('all');
  const [selectedCourseId, setSelectedCourseId] = useState<string>('gd1-cd1');
  const [searchQuery, setSearchQuery] = useState<string>('');
  const [isSidebarCollapsed, setIsSidebarCollapsed] = useState<boolean>(false);
  const [isMobileMenuOpen, setIsMobileMenuOpen] = useState<boolean>(false);
  const [isAuthModalOpen, setIsAuthModalOpen] = useState<boolean>(false);
  const [activeLessonModal, setActiveLessonModal] = useState<ActiveLessonModalState | null>(null);

  // Lắng nghe sự kiện đồng bộ đa tab / thiết bị
  useEffect(() => {
    const handleStorageChange = (e: StorageEvent) => {
      if (e.key === STORAGE_KEYS.USER_PROGRESS && e.newValue) {
        setProgressRecords(JSON.parse(e.newValue));
        setLastSyncedAt(new Date().toISOString());
      }
      if (e.key === STORAGE_KEYS.FLASHCARD_STATS && e.newValue) {
        setFlashcardStats(JSON.parse(e.newValue));
        setLastSyncedAt(new Date().toISOString());
      }
      if (e.key === STORAGE_KEYS.SESSION_USER) {
        setUser(e.newValue ? JSON.parse(e.newValue) : null);
      }
    };
    window.addEventListener('storage', handleStorageChange);
    return () => window.removeEventListener('storage', handleStorageChange);
  }, []);

  const triggerCloudSync = useCallback(async () => {
    if (!user) {
      setSyncState('guest');
      return;
    }
    setSyncState('syncing');
    await new Promise((resolve) => setTimeout(resolve, 650));

    if (isSupabaseConfigured && supabase) {
      const cloudData = await fetchUserCloudData(user.id);
      if (cloudData && cloudData.progress.length > 0) {
        const merged = { ...progressRecords, ...arrayToProgressMap(cloudData.progress) };
        setProgressRecords(merged);
        localStorage.setItem(STORAGE_KEYS.USER_PROGRESS, JSON.stringify(merged));
      }
    }

    const now = new Date().toISOString();
    setLastSyncedAt(now);
    setSyncState('synced');
  }, [user, progressRecords]);

  const login = async (email: string, _password?: string) => {
    setSyncState('syncing');
    await new Promise((r) => setTimeout(r, 600));

    const loggedInUser: UserProfile = {
      ...DEFAULT_DEMO_USER,
      email: email.trim(),
      full_name:
        email.trim().toLowerCase() === DEFAULT_DEMO_USER.email.toLowerCase()
          ? DEFAULT_DEMO_USER.full_name
          : email.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, (l) => l.toUpperCase()),
      last_synced_at: new Date().toISOString(),
    };

    setUser(loggedInUser);
    localStorage.setItem(STORAGE_KEYS.SESSION_USER, JSON.stringify(loggedInUser));
    setLastSyncedAt(new Date().toISOString());
    setSyncState('synced');
    setIsAuthModalOpen(false);
  };

  const register = async (fullName: string, email: string, _password?: string, targetSchool?: string) => {
    setSyncState('syncing');
    await new Promise((r) => setTimeout(r, 700));

    const newUser: UserProfile = {
      id: `usr-${Date.now()}`,
      email: email.trim(),
      full_name: fullName.trim() || 'Học sinh 9+',
      avatar_url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80',
      target_school: targetSchool || 'THPT Chuyên Lam Sơn / THPT Thanh Hóa',
      target_score: 9.5,
      streak_days: 1,
      last_active_device: activeDeviceName,
      last_synced_at: new Date().toISOString(),
    };

    setUser(newUser);
    localStorage.setItem(STORAGE_KEYS.SESSION_USER, JSON.stringify(newUser));
    setLastSyncedAt(new Date().toISOString());
    setSyncState('synced');
    setIsAuthModalOpen(false);
  };

  const logout = () => {
    setUser(null);
    localStorage.removeItem(STORAGE_KEYS.SESSION_USER);
    setSyncState('guest');
  };

  const switchSimulatedDevice = (deviceName: string) => {
    setActiveDeviceName(deviceName);
    if (user) {
      setSyncState('syncing');
      setTimeout(() => {
        const updatedUser = {
          ...user,
          last_active_device: deviceName,
          last_synced_at: new Date().toISOString(),
        };
        setUser(updatedUser);
        localStorage.setItem(STORAGE_KEYS.SESSION_USER, JSON.stringify(updatedUser));
        setLastSyncedAt(new Date().toISOString());
        setSyncState('synced');
      }, 450);
    }
  };

  const updateLessonProgress: LearningStoreContextValue['updateLessonProgress'] = async ({
    courseId,
    lessonId,
    stageId,
    status,
    completionPercent,
    quizScore = null,
    correctAnswers = 0,
    totalQuestions = 0,
    userNotes,
  }) => {
    const existing = progressRecords[lessonId];
    const now = new Date().toISOString();

    const record: UserProgressRecord = {
      id: existing?.id || `prog-${Date.now()}`,
      user_id: user?.id || 'guest-user',
      course_id: courseId,
      lesson_id: lessonId,
      stage_id: stageId,
      status,
      completion_percent: completionPercent,
      quiz_score: quizScore !== null ? quizScore : existing?.quiz_score ?? null,
      correct_answers: correctAnswers || existing?.correct_answers || 0,
      total_questions: totalQuestions || existing?.total_questions || 0,
      time_spent_seconds: (existing?.time_spent_seconds || 0) + 300,
      bookmarked: existing?.bookmarked ?? false,
      user_notes: userNotes !== undefined ? userNotes : existing?.user_notes || '',
      device_updated: activeDeviceName,
      last_accessed_at: now,
      updated_at: now,
    };

    const nextMap = { ...progressRecords, [lessonId]: record };
    setProgressRecords(nextMap);
    localStorage.setItem(STORAGE_KEYS.USER_PROGRESS, JSON.stringify(nextMap));

    if (user) {
      setSyncState('syncing');
      await syncProgressToSupabase(record);
      setTimeout(() => {
        setLastSyncedAt(new Date().toISOString());
        setSyncState('synced');
      }, 400);
    }
  };

  const updateFlashcardStat: LearningStoreContextValue['updateFlashcardStat'] = async ({
    cardId,
    courseId,
    stageId,
    remembered,
    typingAccuracy = 100,
  }) => {
    const existing = flashcardStats[cardId];
    const now = new Date().toISOString();
    const nextBox = remembered
      ? (Math.min(5, (existing?.box_number || 1) + 1) as 1 | 2 | 3 | 4 | 5)
      : 1;
    const masteryLevel =
      nextBox >= 4 ? 'mastered' : nextBox === 3 ? 'reviewing' : 'learning';

    const record: FlashcardStatRecord = {
      id: existing?.id || `fstat-${Date.now()}`,
      user_id: user?.id || 'guest-user',
      card_id: cardId,
      course_id: courseId,
      stage_id: stageId,
      mastery_level: masteryLevel,
      box_number: nextBox,
      review_count: (existing?.review_count || 0) + 1,
      correct_streak: remembered ? (existing?.correct_streak || 0) + 1 : 0,
      typing_accuracy: typingAccuracy,
      last_reviewed_at: now,
      next_review_at: now,
      updated_at: now,
    };

    const nextMap = { ...flashcardStats, [cardId]: record };
    setFlashcardStats(nextMap);
    localStorage.setItem(STORAGE_KEYS.FLASHCARD_STATS, JSON.stringify(nextMap));

    if (user) {
      setSyncState('syncing');
      await syncFlashcardToSupabase(record);
      setTimeout(() => {
        setLastSyncedAt(new Date().toISOString());
        setSyncState('synced');
      }, 350);
    }
  };

  const openLessonModal = (courseId: string, lessonId: string, tab?: LessonType) => {
    const topic = ALL_COURSE_TOPICS.find((t) => t.id === courseId);
    const lesson = topic?.lessons.find((l) => l.id === lessonId);
    setSelectedCourseId(courseId);
    setActiveLessonModal({
      courseId,
      lessonId,
      initialTab: tab || lesson?.type || 'theory',
    });
  };

  const closeLessonModal = () => setActiveLessonModal(null);

  const getCourseProgress = useCallback(
    (course: CourseTopic) => {
      const totalLessons = course.lessons.length;
      let completedLessons = 0;
      let totalPercent = 0;
      let bestQuizScore: number | null = null;

      course.lessons.forEach((lesson) => {
        const rec = progressRecords[lesson.id];
        if (rec) {
          totalPercent += rec.completion_percent;
          if (rec.status === 'completed') completedLessons += 1;
          if (rec.quiz_score !== null && (bestQuizScore === null || rec.quiz_score > bestQuizScore)) {
            bestQuizScore = rec.quiz_score;
          }
        }
      });

      const percent = totalLessons > 0 ? Math.round(totalPercent / totalLessons) : 0;
      const status: LessonStatus =
        percent === 100 ? 'completed' : percent > 0 ? 'in_progress' : 'not_started';

      return { completedLessons, totalLessons, percent, status, bestQuizScore };
    },
    [progressRecords]
  );

  const getStageProgress = useCallback(
    (stageId: Exclude<StageId, 'all'>) => {
      const stageCourses = ALL_COURSE_TOPICS.filter((c) => c.stage_id === stageId);
      let completedLessons = 0;
      let totalLessons = 0;
      let sumPercent = 0;

      stageCourses.forEach((course) => {
        course.lessons.forEach((lesson) => {
          totalLessons += 1;
          const rec = progressRecords[lesson.id];
          if (rec) {
            sumPercent += rec.completion_percent;
            if (rec.status === 'completed') completedLessons += 1;
          }
        });
      });

      const percent = totalLessons > 0 ? Math.round(sumPercent / totalLessons) : 0;
      return { completedLessons, totalLessons, percent };
    },
    [progressRecords]
  );

  const getOverallProgress = useCallback(() => {
    let completedLessons = 0;
    let totalLessons = 0;
    let sumPercent = 0;
    const scores: number[] = [];

    ALL_COURSE_TOPICS.forEach((course) => {
      course.lessons.forEach((lesson) => {
        totalLessons += 1;
        const rec = progressRecords[lesson.id];
        if (rec) {
          sumPercent += rec.completion_percent;
          if (rec.status === 'completed') completedLessons += 1;
          if (rec.quiz_score !== null) scores.push(rec.quiz_score);
        }
      });
    });

    const percent = totalLessons > 0 ? Math.round(sumPercent / totalLessons) : 0;
    const averageScore =
      scores.length > 0
        ? Number((scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1))
        : 9.0;
    const masteredCards = Object.values(flashcardStats).filter(
      (s) => s.mastery_level === 'mastered' || s.box_number >= 3
    ).length;

    return { completedLessons, totalLessons, percent, averageScore, masteredCards };
  }, [progressRecords, flashcardStats]);

  return (
    <LearningStoreContext.Provider
      value={{
        user,
        isAuthenticated: Boolean(user),
        syncState,
        lastSyncedAt,
        activeDeviceName,
        activeNav,
        setActiveNav,
        selectedStage,
        setSelectedStage,
        selectedCourseId,
        setSelectedCourseId,
        searchQuery,
        setSearchQuery,
        isSidebarCollapsed,
        setIsSidebarCollapsed,
        isMobileMenuOpen,
        setIsMobileMenuOpen,
        isAuthModalOpen,
        setIsAuthModalOpen,
        activeLessonModal,
        openLessonModal,
        closeLessonModal,
        progressRecords,
        flashcardStats,
        login,
        register,
        logout,
        triggerCloudSync,
        switchSimulatedDevice,
        updateLessonProgress,
        updateFlashcardStat,
        getCourseProgress,
        getStageProgress,
        getOverallProgress,
      }}
    >
      {children}
    </LearningStoreContext.Provider>
  );
};

function useLearningStore(): LearningStoreContextValue {
  const ctx = useContext(LearningStoreContext);
  if (!ctx) {
    throw new Error('useLearningStore must be used within a LearningStoreProvider');
  }
  return ctx;
}

        return 'bg-[#D6F5FF]/70 hover:bg-[#CAF2FF] border-cyan-200/60';
      case 'indigo':
        return 'bg-[#F3F4FF] hover:bg-[#E9EBFF] border-indigo-100';
      case 'emerald':
        return 'bg-[#EFFDF6] hover:bg-[#E2FAEE] border-emerald-100';
      case 'amber':

      case 'rose':
        return 'bg-[#FFF1F4] hover:bg-[#FFE4EA] border-rose-100';
      default:
        return 'bg-[#F5F6F8] hover:bg-[#ECEEF2] border-slate-200/70';

  const getStatusBadge = () => {
    if (status === 'completed') {
      return (
        <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-semibold bg-emerald-600 text-white">

    openLessonModal(course.id, firstIncomplete.id, firstIncomplete.type);

          {getStatusBadge()}

        {/* Mã chuyên đề & Tên chuyên đề giữ nguyên từ file Word */}
        <div className="mb-2">
          <span className="text-[11px] font-bold uppercase tracking-wider text-[#3B36F4] block mb-0.5">
            {course.code}
          </span>
          <h3 className="text-base sm:text-lg font-extrabold text-slate-900 leading-snug group-hover:text-[#3B36F4] transition-colors">
            {course.title}

        {/* Mô tả ngắn & Trọng số điểm thi Thanh Hóa */}

        <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white/75 text-[11px] font-medium text-slate-700 mb-4 border border-white">

          <span className="truncate">{course.examWeight}</span>
        </div>
      </div>

      {/* Bottom Section: Số lượng bài học, % Hoàn thành & Nút Tiếp tục học */}
      <div className="pt-3 border-t border-slate-900/5 space-y-3">
        <div className="flex items-center justify-between text-xs text-slate-700 font-medium">
          <span className="inline-flex items-center gap-1.5">

        {/* Nút Tiếp tục học + Điểm bài tập nếu có */}

          {bestQuizScore !== null ? (
            <span className="inline-flex items-center gap-1 text-xs font-bold text-emerald-700 bg-emerald-100/80 px-2.5 py-1 rounded-lg">

  );
};

const DailyReviewWidget: React.FC = () => {
  const { flashcardStats, updateFlashcardStat, setActiveNav } = useLearningStore();

  // Lấy toàn bộ danh sách Flashcards từ 22 chuyên đề
  const allFlashcards = ALL_COURSE_TOPICS.flatMap((topic) => topic.flashcards);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [isFlipped, setIsFlipped] = useState(false);

  const currentCard = allFlashcards[currentIndex] || allFlashcards[0];
  const cardStat = flashcardStats[currentCard.id];

  const handleReview = async (remembered: boolean) => {
    await updateFlashcardStat({
      cardId: currentCard.id,
      courseId: currentCard.course_id,
      stageId: currentCard.stage_id,
      remembered,
    });
    setIsFlipped(false);
    setCurrentIndex((prev) => (prev + 1) % allFlashcards.length);
  };

  const speakCardText = (e: React.MouseEvent, text: string) => {
    e.stopPropagation();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text.replace(/[/ˈˌ]/g, ''));
      utterance.lang = 'en-US';
      utterance.rate = 0.92;
      window.speechSynthesis.speak(utterance);
    }
  };

  return (
    <div className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-2xs">
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2">
          <div className="w-7 h-7 rounded-lg bg-indigo-50 text-[#3B36F4] flex items-center justify-center">
            <Layers className="w-4 h-4" />
          </div>
          <div>
            <h3 className="text-sm font-extrabold text-slate-900">Flashcard ôn tập hôm nay</h3>
            <p className="text-[11px] text-slate-400">
              Thẻ {currentIndex + 1}/{allFlashcards.length} • Box {cardStat?.box_number || 1}/5
            </p>
          </div>
        </div>

        <button
          onClick={() => setActiveNav('flashcards')}
          className="text-xs font-semibold text-[#3B36F4] hover:underline inline-flex items-center gap-0.5"
        >
          <span>Luyện gõ</span>
          <ChevronRight className="w-3.5 h-3.5" />
        </button>
      </div>

      {/* Thẻ lật tương tác */}
      <div
        onClick={() => setIsFlipped(!isFlipped)}
        className={`rounded-xl p-4 min-h-[145px] flex flex-col justify-between cursor-pointer transition-all border select-none ${
          isFlipped
            ? 'bg-indigo-50/70 border-indigo-200 text-slate-800'
            : 'bg-slate-900 text-white border-slate-800 hover:bg-slate-800'
        }`}
      >
        <div className="flex items-center justify-between gap-2">
          <span
            className={`text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md ${
              isFlipped ? 'bg-[#3B36F4] text-white' : 'bg-white/15 text-cyan-300'
            }`}
          >
            {isFlipped ? 'Đáp án & Giải thích' : currentCard.category}
          </span>

          <div className="flex items-center gap-1.5">
            <button
              onClick={(e) => speakCardText(e, currentCard.front)}
              className={`p-1 rounded-lg transition-colors ${
                isFlipped ? 'hover:bg-indigo-100 text-slate-600' : 'hover:bg-white/10 text-slate-300'
              }`}
              title="Nghe phát âm mẫu"
            >
              <Volume2 className="w-3.5 h-3.5" />
            </button>
            <RotateCw
              className={`w-3.5 h-3.5 ${isFlipped ? 'text-[#3B36F4]' : 'text-slate-400'}`}
            />
          </div>
        </div>

        <div className="my-2">
          {!isFlipped ? (
            <>
              <p className="text-sm font-bold leading-snug">{currentCard.front}</p>

                <p className="text-xs text-cyan-300 mt-1 font-mono">{currentCard.pronunciation}</p>

            <>

const LessonModal: React.FC = () => {
  const {
    activeLessonModal,
    closeLessonModal,
    progressRecords,
    updateLessonProgress,
    updateFlashcardStat,
  } = useLearningStore();

  const [activeTab, setActiveTab] = useState<LessonType>('theory');
  const [userAnswers, setUserAnswers] = useState<Record<string, string>>({});
  const [isSubmitted, setIsSubmitted] = useState(false);
  const [notes, setNotes] = useState('');
  const [typingInput, setTypingInput] = useState('');
  const [typingFeedback, setTypingFeedback] = useState<string | null>(null);

  const course = ALL_COURSE_TOPICS.find((c) => c.id === activeLessonModal?.courseId);

  useEffect(() => {
    if (activeLessonModal && course) {
      setActiveTab(activeLessonModal.initialTab);
      setIsSubmitted(false);
      setUserAnswers({});
      const theoryLesson = course.lessons.find((l) => l.type === 'theory');
      const existingNote = theoryLesson ? progressRecords[theoryLesson.id]?.user_notes || '' : '';
      setNotes(existingNote);
    }
  }, [activeLessonModal, course, progressRecords]);

  if (!activeLessonModal || !course) return null;

  const theoryLesson = course.lessons.find((l) => l.type === 'theory') || course.lessons[0];
  const flashcardLesson = course.lessons.find((l) => l.type === 'flashcard') || course.lessons[1];
  const exerciseLesson = course.lessons.find((l) => l.type === 'exercise') || course.lessons[2];
  const answerLesson = course.lessons.find((l) => l.type === 'answer_key') || course.lessons[3];

  // Kiểm tra đáp án tự luận hoặc trắc nghiệm
  const checkAnswerCorrect = (questionId: string): boolean => {
    const q = course.exercises.find((item) => item.id === questionId);
    if (!q) return false;
    const rawUser = (userAnswers[questionId] || '').trim().toLowerCase().replace(/\s+/g, ' ');
    if (!rawUser) return false;

    const cleanTarget = q.correctAnswer.trim().toLowerCase().replace(/\s+/g, ' ');
    if (rawUser === cleanTarget) return true;

    // Cho phép chỉ gõ A, B, C, D hoặc khớp với acceptedAnswers
    if (q.options && rawUser === cleanTarget.slice(0, 1)) return true;

    if (q.acceptedAnswers) {
      return q.acceptedAnswers.some(
        (ans) =>
          ans.trim().toLowerCase().replace(/[.]/g, '') === rawUser.replace(/[.]/g, '')
      );
    }

    return rawUser.replace(/[.]/g, '') === cleanTarget.replace(/[.]/g, '');
  };

  const handleCompleteTheory = async () => {
    await updateLessonProgress({
      courseId: course.id,
      lessonId: theoryLesson.id,
      stageId: course.stage_id,
      status: 'completed',
      completionPercent: 100,
      userNotes: notes,
    });
  };

  const handleSubmitExercises = async () => {
    setIsSubmitted(true);
    const total = course.exercises.length;
    let correct = 0;
    course.exercises.forEach((q) => {
      if (checkAnswerCorrect(q.id)) correct += 1;
    });
    const score10 = total > 0 ? Number(((correct / total) * 10).toFixed(1)) : 10;

    await updateLessonProgress({
      courseId: course.id,
      lessonId: exerciseLesson.id,
      stageId: course.stage_id,
      status: 'completed',
      completionPercent: 100,
      quizScore: score10,
      correctAnswers: correct,
      totalQuestions: total,
    });
  };

  const handleMarkAnswerViewed = async () => {
    await updateLessonProgress({
      courseId: course.id,
      lessonId: answerLesson.id,
      stageId: course.stage_id,
      status: 'completed',
      completionPercent: 100,
    });
  };

  const speakText = (text: string) => {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[/ˈˌ]/g, ''));
      u.lang = 'en-US';
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }
  };

  const tabs: { id: LessonType; label: string; icon: React.ComponentType<{ className?: string }> }[] = [
    { id: 'theory', label: '1. Lý thuyết trọng tâm', icon: BookOpen },
    { id: 'flashcard', label: `2. Flashcard & Typing (${course.flashcards.length})`, icon: Layers },
    { id: 'exercise', label: `3. Bài tập vận dụng (${course.exercises.length} câu)`, icon: PenTool },
    { id: 'answer_key', label: '4. Đáp án & Giải thích', icon: KeyRound },
  ];

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-slate-900/60 backdrop-blur-xs">
      <div className="bg-white rounded-3xl max-w-5xl w-full max-h-[92vh] flex flex-col shadow-2xl border border-slate-100 overflow-hidden">
        {/* Modal Header */}

        );

      return matchesStage && matchesText;
    });
  }, [selectedStage, searchQuery]);

    <div className="min-h-screen bg-[#F8FAFC] text-slate-900 flex">
      {/* A. Sidebar cố định trái, thu gọn được trên cả desktop & mobile */}
      <Sidebar />

      {/* Khung nội dung chính + Right Sidebar */}
      <div

        }`}
      >
        <div className="max-w-[1440px] mx-auto p-4 sm:p-6 lg:p-8">
          <div className="bg-white rounded-3xl border border-slate-200/70 shadow-xs p-5 sm:p-7">
            {/* B.1 Dashboard Header (Lời chào, Tìm kiếm, Cloud Sync Status, User Account) */}
            <DashboardHeader />

            {/* Khu vực Grid 12 cột: Main Content (8 cột) & Right Sidebar – Learning Progress (4 cột) */}
            <div className="grid grid-cols-1 xl:grid-cols-12 gap-7 mt-2">
              {/* Cột giữa: Main Content */}
              <main className="xl:col-span-8 min-w-0">
                {activeNav === 'dashboard' || activeNav === 'library' ? (
                  <>
                    {/* B.2 Category Tabs: Tất cả | Giai đoạn 1 | Giai đoạn 2 | Giai đoạn 3 */}
                    <CategoryTabs />

                    {/* B.3 Course Cards (Đại diện cho các chuyên đề trong file Word) */}
                    {filteredCourses.length === 0 ? (
                      <div className="my-8 p-8 rounded-2xl bg-slate-50 border border-slate-200/70 text-center">
                        <p className="text-sm font-bold text-slate-700">
                          Không tìm thấy chuyên đề nào khớp với từ khóa "{searchQuery}".
                        </p>
                        <p className="text-xs text-slate-500 mt-1">
                          Hãy thử tìm theo tên chuyên đề (VD: "Ngữ âm", "9 thì", "Bị động", "Đảo ngữ", "Idioms").
                        </p>
                      </div>
                    ) : (
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">
                        {filteredCourses.map((course) => (
                          <CourseCard
                            key={course.id}
                            course={course}
                            isSelected={course.id === selectedCourseId}
                          />
                        ))}
                      </div>
                    )}

                    {/* B.4 My Lessons: Danh sách bài thuộc chuyên đề (Lý thuyết, Flashcard, Bài tập, Đáp án) */}
                    <LessonList />
                  </>
                ) : (
                  <SecondaryViews />
                )}
              </main>

              {/* C. Right Sidebar – Learning Progress */}
              <aside className="xl:col-span-4 space-y-6">
                {/* C.1 Tổng tiến độ khóa học & Progress Bar từng giai đoạn (Kẻ sọc chéo chuẩn ảnh mẫu) */}
                <ProgressWidget />

                {/* C.2 Flashcard ôn tập trong ngày */}
                <DailyReviewWidget />

                {/* C.3 Mẹo phòng thi Thanh Hóa (Card màu xanh tím #3B36F4 chuẩn ảnh mẫu) */}
                <ExamTipWidget />
              </aside>
            </div>
          </div>
        </div>
      </div>

      {/* Modals tương tác */}
      <AuthModal />
      <LessonModal />
    </div>
  );
};

const App: React.FC = () => {
  return (
    <LearningStoreProvider>
      <DashboardContent />
    </LearningStoreProvider>
  );
};
